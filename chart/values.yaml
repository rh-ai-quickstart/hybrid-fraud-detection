---
# LLM configuration
#
# Option A: Bring your own model (MaaS - Model as a Service)
# model:
#   name: my-model
#   endpoint: https://my-maas-instance:443/v1
#   existingSecret: my-model-credentials
#   apiKeySecretKey: api-key
#
# Option B: Deploy with no model (demo mode -- scorer runs with simulated LLM)
model:
  name: qwen2.5:0.5b
  endpoint: ""
  existingSecret: ""
  # Read endpoint, model name and API key from the same existing Secret.
  endpointFromSecret: false
  apiKeySecretKey: api-key

scoring:
  ruleWeight: 0.6
  llmWeight: 0.4
  maxBatchSize: 100

# Application configuration
app:
  replicas: 1
  # Override with the exact image you built/tested, preferably repository@sha256:digest.
  image: quay.io/redhat-gpte/hybrid-fraud-detection:latest
  imagePullPolicy: IfNotPresent

# The interactive participant UI shares the scorer Pod and uses loopback HTTP.
ui:
  enabled: true
